<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes</title>
<style>
  :root{--bg:#111;--fg:#eee;--dim:#888;--line:#2a2a2a;--warn:#d8a531}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.45 -apple-system,system-ui,Roboto,sans-serif;
       padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:14px 16px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:600}
  a{color:var(--dim);text-decoration:none;font-size:13px}
  .task{border-bottom:1px solid var(--line);padding:12px 16px}
  .task.pendingSync{opacity:.6}
  .quick{padding:12px 16px;border-bottom:1px solid var(--line);background:#151515}
  .name{font-weight:600;display:flex;justify-content:space-between;gap:10px}
  .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .notes{margin:8px 0 0;padding:0;list-style:none}
  .notes li{color:var(--fg);font-size:14px;padding:4px 0 4px 12px;
            border-left:2px solid var(--line)}
  .notes li span{color:var(--dim);font-size:11px;margin-left:6px}
  .recording{margin:9px 0 4px}
  .recording audio{display:block;width:100%;height:38px;margin:4px 0 7px}
  .recordingRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .recordingState{color:var(--dim);font-size:12px}
  .recording button{padding:6px 10px;font-size:12px}
  details.transcript{margin-top:7px;border-top:1px solid var(--line);padding-top:6px}
  details.transcript summary{color:var(--dim);font-size:12px;cursor:pointer}
  .transcriptBody{padding:8px 0 2px}
  .transcriptLabel{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;margin-top:8px}
  .transcriptCopy{white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:3px}
  form{display:flex;gap:8px;margin-top:8px}
  .quick form{display:grid;grid-template-columns:1fr auto;align-items:start}
  .quick input.note{grid-column:1 / -1}
  .quick .options{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  input{flex:1;min-width:0;background:#1b1b1b;border:1px solid var(--line);
        color:var(--fg);border-radius:8px;padding:9px 11px;font-size:16px}
  input[type=number]{width:100%}
  select{width:100%;background:#1b1b1b;border:1px solid var(--line);
         color:var(--fg);border-radius:8px;padding:9px 11px;font-size:16px}
  button{background:#2a2a2a;border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 13px;font-size:14px}
  #status{padding:8px 16px;color:var(--dim);font-size:12px;min-height:18px}
  #status.queued{color:var(--warn)}
  .completed-title{padding:14px 16px 5px;font-size:15px;font-weight:700}
  .date-review{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px}
  .date-review form{display:grid;gap:8px}
  .date-review label{font-size:13px;color:var(--dim)}
  .date-review .evidence{white-space:pre-wrap;font-size:13px;padding:8px 0}
  .date-review .preview{border-top:1px solid var(--line);padding-top:8px}
  input[type=date]{width:100%;color-scheme:dark}
  .quick #followupForm{grid-template-columns:1fr 9.5em auto}
  .fu-row{border-bottom:1px solid var(--line);padding:10px 16px}
  .fu-row.done .fu-label{text-decoration:line-through;color:var(--dim)}
  .fu-row form{display:grid;grid-template-columns:1fr 9.5em;gap:8px;margin-top:6px}
  .fu-actions{display:flex;gap:8px;margin-top:8px}
  .fu-when{color:var(--dim);font-size:12px}
  .fu-when.soon{color:var(--warn)}
  details.fu{margin-top:8px}
  details.fu summary{color:var(--dim);font-size:13px;cursor:pointer}
  details.fu form{display:grid;grid-template-columns:1fr 9.5em auto;gap:8px}
  .phone-nav{position:fixed;left:0;right:0;bottom:0;z-index:5;
             display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
             padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
             background:#080808;border-top:1px solid var(--line)}
  .phone-nav a{color:var(--dim);text-decoration:none;text-align:center;
               padding:9px 4px;border-radius:10px;font-size:13px;font-weight:700}
  .phone-nav a.active{background:#35d386;color:#061a12}
</style>

<header>
  <h1>Notes</h1>
  <a href="/review">Review spoken work &rsaquo;</a>
</header>
<section class="quick">
  <div class="name">Add one-off task</div>
  <form id="taskForm" autocomplete="off">
    <input id="taskLabel" placeholder="2024 taxes, call dentist…" enterkeyhint="next" autocapitalize="sentences">
    <button type="submit">Add</button>
    <input id="taskNote" class="note" placeholder="first clue or why it matters" autocapitalize="sentences">
    <div class="options">
      <input id="taskMinutes" type="number" min="1" inputmode="numeric" placeholder="minutes optional">
      <select id="taskWindow">
        <option value="anytime">Anytime</option>
        <option value="business">Business hours</option>
        <option value="evening">Evening</option>
      </select>
    </div>
  </form>
</section>
<div id="status"></div>
<div id="tasks"></div>
<div class="completed-title">Follow-ups</div>
<section class="quick">
  <form id="followupForm" autocomplete="off">
    <input id="followupLabel" placeholder="Doctor appointment, vet checkup…" autocapitalize="sentences">
    <input id="followupDue" type="date" aria-label="Follow-up date">
    <button type="submit">Add</button>
  </form>
  <div class="meta">Shows on the glasses' Home 7 days before; phone reminder then and on the day.</div>
</section>
<div id="followups"></div>
<div class="completed-title">Completed one-offs</div>
<div id="completedTasks"></div>

<nav class="phone-nav" aria-label="WAM phone pages">
  <a href="/dashboard">List</a>
  <a class="active" href="/notes">Notes</a>
  <a href="/coach">Coach</a>
  <a href="/game">Game</a>
  <a href="/status">Status</a>
</nav>

<script>
/*
 * Notes on the big-ticket tasks.
 *
 * Same discipline as the shared list: every note is queued locally first and
 * POSTed after, so writing one down works with no signal. A note you thought
 * of and lost is worse than no notes at all.
 *
 * Dictation is the phone keyboard's microphone. There is nothing to build for
 * that — tap the mic in Gboard and talk into the field.
 */
const QUEUE_KEY = 'tasknotes.queue'
const TASK_QUEUE_KEY = 'tasks.queue'
const WHO_KEY = 'thelist.who'

const $ = id => document.getElementById(id)
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || [] } catch { return [] } }
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)

let who = 'me'
try { who = localStorage.getItem(WHO_KEY) || 'me' } catch {}

let queue = load(QUEUE_KEY)
let taskQueue = load(TASK_QUEUE_KEY)
let tasks = []
let completedTasks = []
let recordings = {}

function say(msg, queued) {
  $('status').textContent = msg
  $('status').className = queued ? 'queued' : ''
}

function noteSessionId(note) {
  if (!String(note?.by || '').startsWith('listen')) return null
  const id = String(note?.id || '')
  return id.endsWith(':task:note') ? id.slice(0, -10) : id.endsWith(':note') ? id.slice(0, -5) : null
}

function durationLabel(seconds) {
  const total = Math.max(0, Math.round(Number(seconds) || 0))
  const minutes = Math.floor(total / 60)
  const rest = total % 60
  return minutes ? minutes + 'm ' + rest + 's' : rest + 's'
}

function noteExtras(note) {
  const sessionId = noteSessionId(note)
  if (!sessionId) return ''
  const recording = recordings[sessionId]
  const audio = recording?.available
    ? '<audio controls preload="none" src="/coach/session/' + encodeURIComponent(sessionId) + '/recording.wav"></audio>'
    : '<div class="recordingState">Audio was not retained for this older note.</div>'
  const retention = recording?.available
    ? '<div class="recordingRow"><span class="recordingState">' +
        esc(durationLabel(recording.durationSeconds) + (recording.kept ? ' - kept' : ' - 14-day copy')) +
        '</span><button class="keepRecording" type="button" data-session="' + esc(sessionId) +
        '" data-keep="' + (recording.kept ? 'false' : 'true') + '">' +
        (recording.kept ? 'Let expire' : 'Keep recording') + '</button></div>'
    : ''
  return '<div class="recording">' + audio + retention +
    '<details class="transcript" data-session="' + esc(sessionId) + '">' +
      '<summary>Check transcript</summary><div class="transcriptBody">Open to load transcript.</div>' +
    '</details></div>'
}

function render() {
  const pending = {}
  for (const q of queue) (pending[q.id] = pending[q.id] || []).push(q)

  const pendingTasks = taskQueue.map(q => ({
    id: q.clientId,
    label: q.label,
    estimateMs: q.estimateMinutes ? q.estimateMinutes * 60000 : null,
    note: q.note,
    open: true,
    pending: true,
    notes: q.note ? [{ text: q.note, by: q.by, pending: true }] : [],
  }))

  $('tasks').innerHTML = [...pendingTasks, ...tasks].map(t => {
    const notes = [...(t.notes || []), ...(pending[t.id] || []).map(q => ({ text: q.text, by: q.by, pending: true }))]
    const est = t.estimateMs ? Math.round(t.estimateMs / 60000) + 'm' : 'no estimate'
    const shut = t.open ? '' : ' - opens ' + t.opensLabel
    return '<div class="task' + (t.pending ? ' pendingSync' : '') + '">' +
      '<div class="name"><span>' + esc(t.label) + '</span></div>' +
      '<div class="meta">' + esc((t.pending ? 'saving - ' : '') + est + shut + (t.note ? ' - ' + t.note : '')) + '</div>' +
      (notes.length ? '<ul class="notes">' + notes.map(n =>
        '<li>' + esc(n.text) + '<span>' + esc(n.by || '') + (n.pending ? ' - saving' : '') + '</span>' +
        (n.pending ? '' : noteExtras(n)) + '</li>').join('') + '</ul>' : '') +
      (t.pending ? '' : '<form data-id="' + esc(t.id) + '">' +
        '<input placeholder="what do you need to know first?" enterkeyhint="done" autocapitalize="sentences">' +
        '<button type="submit">Add</button>' +
      '</form>' +
      '<details class="fu"><summary>Done, follow up later…</summary>' +
        '<form class="fuFromTask" data-task="' + esc(t.id) + '">' +
          '<input name="label" placeholder="Follow up: ' + esc(t.label) + '" autocapitalize="sentences">' +
          '<input name="due" type="date" required>' +
          '<button type="submit">Save</button>' +
        '</form></details>') + '</div>'
  }).join('') || '<div class="task">No open tasks.</div>'

  for (const form of document.querySelectorAll('.task form[data-id]')) form.onsubmit = onAdd
  for (const form of document.querySelectorAll('form.fuFromTask')) form.onsubmit = onFollowupFromTask
  for (const button of document.querySelectorAll('.keepRecording')) button.onclick = onKeepRecording
  for (const details of document.querySelectorAll('details.transcript')) details.ontoggle = onTranscriptToggle
  renderCompleted()
  renderFollowups()
}

/*
 * Dated follow-ups (v0.170.0). Online actions: each one is a single request
 * the hub applies or rejects, and the list re-reads from the hub afterwards.
 */
let followups = []

function followupWhen(days) {
  if (days === 0) return 'today'
  if (days === 1) return 'tomorrow'
  return days < 0 ? (-days) + ' days late' : 'in ' + days + ' days'
}

function renderFollowups() {
  const open = followups.filter(f => !f.doneAt)
  const done = followups.filter(f => f.doneAt).slice(-5)
  $('followups').innerHTML = [...open, ...done].map(f =>
    '<div class="fu-row' + (f.doneAt ? ' done' : '') + '" data-id="' + esc(f.id) + '">' +
      '<div class="name"><span class="fu-label">' + esc(f.label) + '</span>' +
      '<span class="fu-when' + (!f.doneAt && f.daysLeft <= 7 ? ' soon' : '') + '">' +
        esc(f.doneAt ? 'done' : followupWhen(f.daysLeft) + (f.daysLeft <= 7 ? ' - on Home' : '')) + '</span></div>' +
      (f.doneAt ? '' : '<form class="fuEdit"><input name="label" value="' + esc(f.label) + '" autocapitalize="sentences">' +
        '<input name="due" type="date" value="' + esc(f.dueDay) + '" required></form>') +
      '<div class="fu-actions">' +
        (f.doneAt ? '<button data-act="undo">Undo</button>'
          : '<button data-act="save">Save</button><button data-act="done">Done</button>') +
        '<button data-act="delete">Delete</button>' +
      '</div></div>').join('') || '<div class="task meta">No follow-ups.</div>'
  for (const button of document.querySelectorAll('.fu-row button')) button.onclick = onFollowupAction
}

async function followupPost(path, body) {
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
    const payload = await res.json().catch(() => null)
    if (!res.ok) { say((payload && payload.error) || 'could not save follow-up', true); return false }
    if (payload && payload.items) followups = payload.items
    return true
  } catch {
    say('offline - follow-up not saved', true)
    return false
  }
}

async function onFollowupAction(e) {
  const button = e.currentTarget
  const row = button.closest('.fu-row')
  const id = encodeURIComponent(row.dataset.id)
  const act = button.dataset.act
  if (act === 'delete' && button.dataset.armed !== '1') {
    // Two taps, no dialog: the first only arms it.
    button.dataset.armed = '1'
    button.textContent = 'Sure? Delete'
    setTimeout(() => { button.dataset.armed = ''; button.textContent = 'Delete' }, 4000)
    return
  }
  let ok = false
  if (act === 'save') {
    const form = row.querySelector('form.fuEdit')
    ok = await followupPost('/followups/' + id, { label: form.label.value.trim(), dueDay: form.due.value })
  } else if (act === 'done' || act === 'undo') {
    ok = await followupPost('/followups/' + id + '/done', { done: act === 'done' })
  } else if (act === 'delete') {
    ok = await followupPost('/followups/' + id + '/delete', {})
  }
  if (ok) say('')
  renderFollowups()
}

async function onFollowupFromTask(e) {
  e.preventDefault()
  const form = e.target
  const label = form.label.value.trim()
  const ok = await followupPost('/task/' + encodeURIComponent(form.dataset.task) + '/followup', {
    dueDay: form.due.value,
    label: label || undefined,
    clientId: 'phone-' + uid(),
  })
  if (ok) { say('task done - follow-up saved'); await sync() }
}

$('followupForm').onsubmit = async e => {
  e.preventDefault()
  const label = $('followupLabel').value.trim()
  const due = $('followupDue').value
  if (!label || !due) { say('follow-up needs a name and a date', true); return }
  if (await followupPost('/followups', { label, dueDay: due, clientId: 'phone-' + uid() })) {
    $('followupLabel').value = ''
    $('followupDue').value = ''
    say('')
    renderFollowups()
  }
}

function renderCompleted() {
  if (document.querySelector('.date-review[open]')) return
  $('completedTasks').innerHTML = completedTasks.map(task => {
    const voiceNotes = task.voiceEvidence || []
    const recorded = new Date(task.doneAt).toLocaleDateString()
    return '<div class="task"><div class="name">' + esc(task.label) + '</div>' +
      '<div class="meta">Recorded done ' + esc(recorded) +
      (task.completedOn ? ' · reviewed date ' + esc(task.completedOn) : '') + '</div>' +
      (voiceNotes.length ? '<details class="date-review" data-id="' + esc(task.id) + '">' +
        '<summary>Correct completion date</summary>' +
        '<form><label>Voice note to review<select name="noteId" required><option value="">Choose voice note</option>' +
          voiceNotes.map(note => '<option value="' + esc(note.id) + '">' + esc((note.by === 'spoken-review' ? 'Reviewed Solo Note: ' : 'Listen note: ') + note.text.slice(0, 60)) + '</option>').join('') +
        '</select></label><div class="evidence"></div>' +
        '<label>Actual completion date<input name="day" type="date" required></label>' +
        '<button type="submit">Review date change</button></form><div class="preview"></div></details>' :
        '<div class="meta">Link a reviewed Solo Note or record a task Listen note to correct this date.</div>') +
      '<button class="reopen-task" type="button" data-id="' + esc(task.id) + '">Reopen task</button>' +
      '</div>'
  }).join('') || '<div class="task">No completed tasks.</div>'
  for (const button of document.querySelectorAll('.reopen-task')) {
    let armed = false
    button.onclick = async () => {
      if (!armed) {
        armed = true
        button.textContent = 'Confirm reopen?'
        setTimeout(() => { if (button.isConnected) { armed = false; button.textContent = 'Reopen task' } }, 8000)
        return
      }
      button.disabled = true
      try {
        const response = await fetch('/task/' + encodeURIComponent(button.dataset.id) + '/reopen', { method: 'POST' })
        if (!response.ok) throw new Error('Could not reopen task')
        say('Task reopened', false)
        for (const detail of document.querySelectorAll('.date-review[open]')) detail.open = false
        await sync()
      } catch (error) {
        say(error.message || 'Could not reopen task', true)
        button.disabled = false
      }
    }
  }
  for (const details of document.querySelectorAll('.date-review')) {
    const task = completedTasks.find(row => row.id === details.dataset.id)
    const select = details.querySelector('select')
    const evidence = details.querySelector('.evidence')
    select.onchange = () => {
      evidence.textContent = task.voiceEvidence.find(note => note.id === select.value)?.text || ''
      details.querySelector('.preview').replaceChildren()
    }
    details.querySelector('input[name=day]').onchange = () => details.querySelector('.preview').replaceChildren()
    details.querySelector('form').onsubmit = event => reviewCompletionDate(event, task, details)
  }
}

async function reviewCompletionDate(event, task, details) {
  event.preventDefault()
  const form = event.currentTarget
  const day = form.elements.day.value
  const noteId = form.elements.noteId.value
  const box = details.querySelector('.preview')
  box.textContent = 'Checking date...'
  try {
    const response = await fetch('/task/' + encodeURIComponent(task.id) + '/completion-date', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'preview', day, noteId }),
    })
    const preview = await response.json()
    if (!response.ok) throw new Error(preview.error || 'Could not review date')
    box.replaceChildren()
    const summary = document.createElement('div')
    summary.className = 'evidence'
    summary.textContent = preview.label + ': change scored completion from ' + preview.beforeDay +
      ' to ' + preview.proposedDay + '?\nVoice note: ' + preview.note.text
    const confirm = document.createElement('button')
    confirm.type = 'button'
    confirm.textContent = 'Confirm corrected date'
    confirm.onclick = async () => {
      confirm.disabled = true
      try {
        const saved = await fetch('/task/' + encodeURIComponent(task.id) + '/completion-date', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'confirm', day, noteId, reviewKey: preview.reviewKey }),
        })
        const result = await saved.json()
        if (!saved.ok) throw new Error(result.error || 'Could not save date')
        say('Completion date corrected for ' + task.label, false)
        details.open = false
        await sync()
      } catch (error) {
        say(error.message || 'Could not save date', true)
        confirm.disabled = false
      }
    }
    box.append(summary, confirm)
  } catch (error) {
    box.textContent = error.message || 'Could not review date'
  }
}

async function onKeepRecording(e) {
  const button = e.currentTarget
  button.disabled = true
  try {
    const res = await fetch('/coach/session/' + encodeURIComponent(button.dataset.session) + '/recording/keep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keep: button.dataset.keep === 'true' }),
    })
    if (!res.ok) throw new Error('Could not update recording')
    say(button.dataset.keep === 'true' ? 'Recording kept.' : 'Recording will expire after 14 days.', false)
    await sync()
  } catch (err) {
    say(err.message || 'Could not update recording', true)
    button.disabled = false
  }
}

async function onTranscriptToggle(e) {
  const details = e.currentTarget
  if (!details.open || details.dataset.loaded === 'true') return
  const body = details.querySelector('.transcriptBody')
  body.textContent = 'Loading transcript...'
  try {
    const res = await fetch('/coach/session/' + encodeURIComponent(details.dataset.session) + '/transcript', { cache: 'no-store' })
    if (!res.ok) throw new Error('Transcript unavailable')
    const data = await res.json()
    const joined = (data.segments || []).map(segment => segment.text).filter(Boolean).join('\n\n')
    const raw = (data.rawSegments || []).map((segment, index) => (index + 1) + '. ' + segment.text).filter(Boolean).join('\n')
    body.innerHTML = '<div class="transcriptLabel">Joined transcript</div>' +
      '<div class="transcriptCopy">' + esc(joined || 'No transcript lines.') + '</div>' +
      '<div class="transcriptLabel">Raw STT chunks</div>' +
      '<div class="transcriptCopy">' + esc(raw || 'No raw chunks.') + '</div>'
    details.dataset.loaded = 'true'
  } catch (err) {
    body.textContent = err.message || 'Transcript unavailable'
  }
}

async function flush() {
  await flushTasks()
  if (queue.length === 0) return true
  const rest = []
  for (const q of queue) {
    try {
      const res = await fetch('/task/' + encodeURIComponent(q.id) + '/note', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: q.text, by: q.by, clientId: q.clientId }),
      })
      if (!res.ok) rest.push(q)
    } catch { rest.push(q) }
  }
  queue = rest
  save(QUEUE_KEY, queue)
  return queue.length === 0
}

async function flushTasks() {
  if (taskQueue.length === 0) return true
  const rest = []
  for (const q of taskQueue) {
    try {
      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(q),
      })
      if (!res.ok) rest.push(q)
    } catch { rest.push(q) }
  }
  taskQueue = rest
  save(TASK_QUEUE_KEY, taskQueue)
  return taskQueue.length === 0
}

async function sync() {
  const drained = await flush()
  try {
    const [taskRes, recordingRes, followupRes] = await Promise.all([
      fetch('/tasks?includeDone=1', { cache: 'no-store' }),
      fetch('/recordings', { cache: 'no-store' }),
      fetch('/followups', { cache: 'no-store' }),
    ])
    if (followupRes.ok) followups = (await followupRes.json()).items || []
    if (taskRes.ok) {
      const payload = await taskRes.json()
      tasks = payload.tasks || []
      completedTasks = payload.completedTasks || []
    }
    if (recordingRes.ok) {
      const rows = (await recordingRes.json()).recordings || []
      recordings = Object.fromEntries(rows.map(recording => [recording.sessionId, recording]))
    }
    const waiting = queue.length + taskQueue.length
    say(drained && waiting === 0 ? '' : waiting + ' waiting to sync', waiting > 0)
  } catch {
    const waiting = queue.length + taskQueue.length
    say(waiting ? waiting + ' waiting to sync' : 'offline - notes are saved', true)
  }
  render()
}

function onAdd(e) {
  e.preventDefault()
  const input = e.target.querySelector('input')
  const body = input.value.trim()
  if (!body) return
  queue.push({ id: e.target.dataset.id, text: body, by: who, clientId: uid(), at: Date.now() })
  save(QUEUE_KEY, queue)
  input.value = ''
  render()
  sync()
}

$('taskForm').onsubmit = e => {
  e.preventDefault()
  const label = $('taskLabel').value.trim()
  if (!label) return
  const minutes = Number($('taskMinutes').value)
  const note = $('taskNote').value.trim()
  taskQueue.push({
    label,
    note,
    firstNote: note,
    estimateMinutes: Number.isFinite(minutes) && minutes > 0 ? minutes : null,
    window: $('taskWindow').value,
    weight: 'big',
    space: 'life',
    by: who,
    clientId: 't' + uid(),
    at: Date.now(),
  })
  save(TASK_QUEUE_KEY, taskQueue)
  $('taskLabel').value = ''
  $('taskNote').value = ''
  $('taskMinutes').value = ''
  $('taskWindow').value = 'anytime'
  render()
  sync()
}

sync()
setInterval(sync, 20000)
</script>
