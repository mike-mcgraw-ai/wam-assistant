<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>WAM</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #camera{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  #camera[hidden]{display:none}
  #controls{
    position:fixed; z-index:2; top:calc(env(safe-area-inset-top) + 14px);
    right:calc(env(safe-area-inset-right) + 14px);
    display:flex; gap:8px;
  }
  #controls button{
    padding:10px 14px; border:1px solid #8fd9a8; border-radius:8px;
    background:rgba(0,0,0,.82); color:#d8ffe1;
    font:600 14px ui-sans-serif,system-ui,sans-serif;
  }
  #controls button:disabled{opacity:.6}
  #fullscreen-help{
    position:fixed; z-index:2; left:14px; right:14px;
    bottom:calc(env(safe-area-inset-bottom) + 54px);
    margin:0 auto; max-width:420px; padding:10px 12px;
    border:1px solid #8fd9a8; border-radius:8px;
    background:rgba(0,0,0,.9); color:#d8ffe1;
    font:14px/1.4 ui-sans-serif,system-ui,sans-serif;
  }
  #fullscreen-help[hidden]{display:none}
  #turn-hint{
    display:none; position:fixed; z-index:2; left:50%;
    bottom:calc(env(safe-area-inset-bottom) + 54px);
    transform:translateX(-50%); margin:0; padding:8px 12px;
    border-radius:8px; background:rgba(0,0,0,.82); color:#d8ffe1;
    font:13px ui-sans-serif,system-ui,sans-serif; white-space:nowrap;
  }
  @media (orientation:portrait){
    body.camera-on #turn-hint{display:block}
  }
  #fullscreen-help:not([hidden]) ~ #turn-hint{display:none}
  #camera-status{
    position:fixed; z-index:2; left:50%; bottom:calc(env(safe-area-inset-bottom) + 14px);
    transform:translateX(-50%); margin:0; padding:8px 12px;
    border-radius:8px; background:rgba(0,0,0,.82); color:#d8ffe1;
    font:13px ui-sans-serif,system-ui,sans-serif; white-space:nowrap;
  }
  #camera-status[hidden]{display:none}
  body.camera-on pre{
    text-shadow:0 0 3px #000,0 0 7px #000,0 0 10px rgba(43,255,106,.65);
  }
  /* 576x288 is the panel. The mirror keeps that ratio and scales to fit, so
     what you see on the iPad breaks lines exactly where the glasses do. */
  /* --bar is the touch controls' height (v0.174.0): zero when there are none. */
  :root{--bar:0px}
  body.touch{--bar:calc(112px + env(safe-area-inset-bottom))}
  body.touch{padding-bottom:var(--bar); box-sizing:border-box}
  #panel{
    width:min(100vw, calc((100vh - var(--bar)) * 2));
    height:min(calc(100vh - var(--bar)), calc(100vw / 2));
    position:relative;
    pointer-events:none;
  }
  pre{
    position:absolute; inset:0; margin:0;
    display:flex; flex-direction:column; justify-content:flex-start;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:calc(100cqw / 46);
    line-height:1.34;
    color:#2bff6a; text-shadow:0 0 6px rgba(43,255,106,.35);
    padding:2.2% 2.6%; white-space:pre; letter-spacing:.02em;
  }
  #panel{container-type:inline-size}
  #stale{
    position:absolute; right:2%; top:2%; width:10px; height:10px;
    border-radius:50%; background:#2bff6a; opacity:.9;
  }
  #stale.off{background:#444}
  /* Keyboard: a one-line note of the last key, and a key list that shows on
     load and on "?" so it never sits over the frame on the iPad. */
  #sent,#keys{
    position:absolute; left:2%; bottom:2%; margin:0;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#8fd9a8;
    background:rgba(0,0,0,.94); padding:4px 8px; border-radius:4px;
    transition:opacity .3s; pointer-events:none;
  }
  #sent{opacity:0}
  #sent.on{opacity:1}
  #sent.warn{color:#f0b429}
  #keys{bottom:auto; top:2%; white-space:pre; opacity:0}
  #keys.on{opacity:1}
  body.touch #keys{display:none}

  /* Touch controls (v0.174.0): the ring's gestures as buttons, so an iPad or
     phone can drive the glasses, not only watch them. */
  #pad{
    display:none; position:fixed; z-index:3; left:0; right:0; bottom:0;
    height:var(--bar); box-sizing:border-box;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:#05140a; border-top:1px solid #1d4a2b;
    grid-template-columns:repeat(4, minmax(0, 1fr)) 1.4fr; gap:10px; align-items:stretch;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  body.touch #pad{display:grid}
  #pad button{
    border:1px solid #2e7a47; border-radius:14px; background:#0b2614; color:#d8ffe1;
    font:700 20px ui-sans-serif,system-ui,sans-serif; -webkit-tap-highlight-color:transparent;
  }
  #pad button:active{background:#2bff6a; color:#03140a}
  #pad .menu{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px}
  #pad .menu button{font-size:14px; font-weight:600; border-radius:10px}
  body.embed #controls,body.embed #fullscreen-help,body.embed #turn-hint{display:none}
</style>

<video id="camera" autoplay muted playsinline hidden></video>
<div id="controls">
  <button id="camera-toggle" type="button" aria-pressed="false">Camera view</button>
  <button id="fullscreen-toggle" type="button" aria-pressed="false">Full screen</button>
</div>
<p id="fullscreen-help" role="status" hidden>On iPhone: Safari Share → Add to Home Screen → Open as Web App, then open WAM from its icon to hide the browser bar. Turn the phone sideways for landscape.</p>
<p id="turn-hint">Turn phone sideways for landscape</p>
<p id="camera-status" role="status" hidden>Open WAM on the glasses</p>
<div id="pad" role="group" aria-label="Glasses controls">
  <button type="button" data-action="up" aria-label="Scroll up">▲</button>
  <button type="button" data-action="down" aria-label="Scroll down">▼</button>
  <button type="button" data-action="click" aria-label="Tap">● Tap</button>
  <button type="button" data-action="double" aria-label="Back (double tap)">↩ Back</button>
  <div class="menu" id="menu"></div>
</div>
<div id="panel"><pre id="screen">connecting…</pre><div id="stale"></div><p id="sent"></p><p id="keys"></p></div>

<script>
/*
 * Mirror of the glasses display.
 *
 * Shows the last frame the app pushed. It only updates while the glasses app
 * is open — nothing else renders those screens — so the dot goes dark when the
 * frame stops being fresh rather than leaving a stale page looking live.
 */
const screen = document.getElementById('screen')
const dot = document.getElementById('stale')
const camera = document.getElementById('camera')
const cameraToggle = document.getElementById('camera-toggle')
const cameraStatus = document.getElementById('camera-status')
const fullscreenToggle = document.getElementById('fullscreen-toggle')
const fullscreenHelp = document.getElementById('fullscreen-help')
let lastAt = 0
let lastText = ''
let freshFrame = false
let cameraStream = null

function showFullscreenState() {
  const fullscreen = Boolean(document.fullscreenElement)
  fullscreenToggle.textContent = fullscreen ? 'Exit full screen' : 'Full screen'
  fullscreenToggle.setAttribute('aria-pressed', String(fullscreen))
  if (fullscreen || navigator.standalone) fullscreenHelp.hidden = true
}

fullscreenToggle.addEventListener('click', async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen()
    return
  }
  if (!document.documentElement.requestFullscreen) {
    fullscreenHelp.hidden = false
    return
  }
  try {
    await document.documentElement.requestFullscreen()
    try {
      await window.screen?.orientation?.lock?.('landscape')
    } catch {
      note('Turn the phone sideways for landscape', true)
    }
  } catch {
    fullscreenHelp.hidden = false
  }
})
document.addEventListener('fullscreenchange', showFullscreenState)
if (navigator.standalone) fullscreenToggle.hidden = true
showFullscreenState()

function showFrame() {
  dot.className = freshFrame ? '' : 'off'
  cameraStatus.hidden = !cameraStream || freshFrame
  cameraStatus.textContent = lastAt ? 'Waiting for a live WAM screen' : 'Open WAM on the glasses'
  screen.textContent = cameraStream && !freshFrame
    ? ''
    : lastAt ? lastText : 'No frame yet.\n\nOpen WAM on the glasses.'
}

async function tick() {
  try {
    const res = await fetch('/screen', { cache: 'no-store' })
    const frame = await res.json()
    if (frame.at && frame.at !== lastAt) {
      lastAt = frame.at
      lastText = frame.text || ''
    }
    freshFrame = Boolean(frame.at && Date.now() - frame.at < 20000)
  } catch {
    freshFrame = false
  }
  showFrame()
}

tick()
setInterval(tick, 1000)

function stopCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(track => track.stop())
  cameraStream = null
  camera.srcObject = null
  camera.hidden = true
  document.body.classList.remove('camera-on')
  cameraToggle.textContent = 'Camera view'
  cameraToggle.setAttribute('aria-pressed', 'false')
  showFrame()
}

cameraToggle.addEventListener('click', async () => {
  if (cameraStream) {
    stopCamera()
    return
  }
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    note('Open the HTTPS mirror link to use the camera', true)
    return
  }
  cameraToggle.disabled = true
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { exact: 'environment' } },
    })
    if (document.hidden) {
      stream.getTracks().forEach(track => track.stop())
      return
    }
    cameraStream = stream
    camera.srcObject = stream
    camera.hidden = false
    await camera.play()
    if (document.hidden) {
      stopCamera()
      return
    }
    document.body.classList.add('camera-on')
    cameraToggle.textContent = 'Stop camera'
    cameraToggle.setAttribute('aria-pressed', 'true')
    showFrame()
  } catch (error) {
    stopCamera()
    note(error?.name === 'NotAllowedError' ? 'Allow camera access to use this view' : 'Camera unavailable', true)
  } finally {
    cameraToggle.disabled = false
  }
})

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera()
})
window.addEventListener('pagehide', stopCamera)

/*
 * Drive the glasses from the keyboard.
 *
 * Each key is posted to /input; the app on the glasses long-polls it and
 * handles the key exactly like the matching ring gesture. The OS menu cannot
 * be opened remotely, so the number keys pick its items directly — the IDs are
 * the menuItems in glasses/src/main.ts.
 */
const MENU = [
  ['1', 'Listen', 12],
  ['2', 'Chat', 14],
  ['3', 'Notes', 13],
  ['4', 'Lists', 6],
  ['5', 'Diagnostics', 7],
]
const KEYS = {
  ArrowUp: ['up', '↑ up'], k: ['up', '↑ up'],
  ArrowDown: ['down', '↓ down'], j: ['down', '↓ down'],
  ArrowRight: ['click', 'click'], ' ': ['click', 'click'],
  Escape: ['double', 'double-tap (back)'], Backspace: ['double', 'double-tap (back)'],
}
for (const [key, name, id] of MENU) KEYS[key] = ['menu:' + id, 'menu: ' + name]

const sent = document.getElementById('sent')
const keysBox = document.getElementById('keys')
keysBox.textContent = [
  '↑ ↓  or  k j   scroll',
  '→ / Space       click',
  'Esc / ⌫        double-tap (back)',
  ...MENU.map(([key, name]) => key.padEnd(15) + name),
  '?              show / hide this',
].join('\n')

let keysTimer
function showKeys(ms) {
  keysBox.classList.add('on')
  clearTimeout(keysTimer)
  if (ms) keysTimer = setTimeout(() => keysBox.classList.remove('on'), ms)
}
showKeys(6000)

let sentTimer
function note(text, warn) {
  sent.textContent = text
  sent.className = warn ? 'on warn' : 'on'
  clearTimeout(sentTimer)
  sentTimer = setTimeout(() => { sent.className = '' }, warn ? 4000 : 1200)
}

async function press(action, label) {
  try {
    const res = await fetch('/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    })
    const body = await res.json()
    if (!res.ok) return note(body.error || 'hub refused ' + action, true)
    // Nobody waiting means the app is closed, asleep in the background, or
    // an older build without keyboard support.
    note(body.listening ? label : label + ' — sent, but the glasses app is not listening', !body.listening)
  } catch {
    return note('hub unreachable', true)
  }
  // The new frame lands when the glasses repaint; look for it sooner than the
  // once-a-second poll would.
  for (const ms of [250, 600, 1100]) setTimeout(tick, ms)
}

/*
 * Touch controls (v0.174.0). Shown on touch screens, with ?controls=1, and in
 * ?embed=1 — the WAM Home kiosk's Glasses view, which also hides the camera
 * and full-screen buttons it has no use for.
 */
const params = new URLSearchParams(location.search)
if (params.get('embed') === '1') document.body.classList.add('embed')
if (params.get('embed') === '1' || params.get('controls') === '1' || matchMedia('(pointer: coarse)').matches) {
  document.body.classList.add('touch')
}
const LABELS = { up: '↑ up', down: '↓ down', click: 'tap', double: 'back' }
const menuHost = document.getElementById('menu')
for (const [, name, id] of MENU) {
  const b = document.createElement('button')
  b.type = 'button'
  b.dataset.action = 'menu:' + id
  b.textContent = name
  menuHost.appendChild(b)
}
document.getElementById('pad').addEventListener('click', event => {
  const action = event.target.closest('button')?.dataset.action
  if (!action) return
  press(action, LABELS[action] || 'menu: ' + event.target.textContent)
})

window.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey) return
  if (event.key === '?') {
    keysBox.classList.contains('on') ? keysBox.classList.remove('on') : showKeys(0)
    return
  }
  const hit = KEYS[event.key]
  if (!hit) return
  event.preventDefault()
  // Holding an arrow scrolls like a flick; taps do not repeat.
  if (event.repeat && hit[0] !== 'up' && hit[0] !== 'down') return
  press(hit[0], hit[1])
})
</script>
